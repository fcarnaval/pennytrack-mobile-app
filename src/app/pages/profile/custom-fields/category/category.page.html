<app-header pageTitle="Categorias" [showAction]="true" actionIcon="add-circle-outline" (action)="add()"></app-header>
  
  <ion-content class="ion-padding">
    <ion-list>
        <ion-item *ngFor="let c of categories">
          <ion-label>{{ c.name }}</ion-label>
          <ion-button fill="clear" slot="end" (click)="confirmDelete(c)">
            <ion-icon name="trash-outline" slot="icon-only" color="danger"></ion-icon>
          </ion-button>
        </ion-item>
      </ion-list>      
  </ion-content>
